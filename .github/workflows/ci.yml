name: RF Observatory CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rf-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Core, protocol and web model tests
        run: SANITIZE=1 bash scripts/check.sh
      - name: Validate production security profile invariants
        shell: bash
        run: |
          set -euo pipefail
          profile=firmware/sdkconfig.production.defaults
          test -s "$profile"
          grep -qx 'CONFIG_SECURE_BOOT=y' "$profile"
          grep -qx 'CONFIG_SECURE_BOOT_V2_ENABLED=y' "$profile"
          grep -qx 'CONFIG_SECURE_FLASH_ENC_ENABLED=y' "$profile"
          grep -qx 'CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y' "$profile"
          grep -qx 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' "$profile"
          grep -qx 'CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y' "$profile"
          ! grep -q 'CONFIG_SECURE_FLASH_ENCRYPTION_MODE_DEVELOPMENT=y' "$profile"
          ! grep -q 'CONFIG_SECURE_BOOT_INSECURE=y' "$profile"
      - name: Gateway HTTP, SSE and journal integration
        run: node --test tests/gateway-http.mjs
      - name: CMake build
        run: |
          cmake -S . -B build/cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cmake --parallel
          ctest --test-dir build/cmake --output-on-failure
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate ephemeral HTTPS certificate for ESP32-S3 compile test
        if: matrix.target == 'esp32s3'
        run: |
          echo CONFIG_RF_GPIO_DIAGNOSTICS=y >> firmware/sdkconfig.defaults
          mkdir -p firmware/main/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes             -keyout firmware/main/certs/server.key             -out firmware/main/certs/server.crt             -days 1             -subj "/CN=rf-observatory.local/O=RF Observatory CI"
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: ${{ matrix.target }}
          path: firmware
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rf-simulation-${{ matrix.target }}
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flasher_args.json
          if-no-files-found: error


  production-security:
    name: Resolve ESP32-S3 production security configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.4.2
      - name: Resolve isolated production defaults (no flash or provisioning)
        working-directory: firmware
        run: |
          set -euo pipefail
          idf.py -B build/security -DSDKCONFIG=sdkconfig.security -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.production.defaults" -DIDF_TARGET=esp32s3 reconfigure 2>&1 | tee security-config.log
          ! grep -Eqi 'unknown kconfig symbol' security-config.log
      - name: Assert effective security settings
        working-directory: firmware
        shell: bash
        run: |
          set -euo pipefail
          config=sdkconfig.security
          for option in SECURE_BOOT SECURE_BOOT_V2_ENABLED SECURE_BOOT_BUILD_SIGNED_BINARIES SECURE_FLASH_ENC_ENABLED SECURE_FLASH_ENCRYPTION_MODE_RELEASE BOOTLOADER_APP_ROLLBACK_ENABLE BOOTLOADER_APP_ANTI_ROLLBACK; do
            grep -qx "CONFIG_${option}=y" "$config"
          done
          grep -qx 'CONFIG_BOOTLOADER_APP_SECURE_VERSION=1' "$config"
          ! grep -qx 'CONFIG_SECURE_FLASH_ENCRYPTION_MODE_DEVELOPMENT=y' "$config"
          ! grep -qx 'CONFIG_SECURE_BOOT_INSECURE=y' "$config"


  firmware-next:
    name: ESP32-S3 / ESP-IDF 6.1 compatibility
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate ephemeral HTTPS certificate
        run: |
          echo CONFIG_RF_GPIO_DIAGNOSTICS=y >> firmware/sdkconfig.defaults
          mkdir -p firmware/main/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -keyout firmware/main/certs/server.key -out firmware/main/certs/server.crt -days 1 -subj "/CN=rf-observatory.local/O=RF Observatory CI"
      - name: Build ESP32-S3 with ESP-IDF 6.1
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: firmware
